name: Standalone binaries

on:
  push:
    branches: [main, 'feat/**', 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows, darwin, linux]
        arch: [amd64, arm64]
    env:
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build commands and package standalone server
        run: |
          go build ./cmd/...
          mkdir dist
          suffix=""
          if [[ "$GOOS" == windows ]]; then suffix=.exe; fi
          go build -trimpath -ldflags='-s -w' -o "dist/release-control-$GOOS-$GOARCH$suffix" ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows SQLite tests and smoke
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 -timeout=50m ./internal/persistence/... ./internal/application/... ./internal/agentconnect/... ./cmd/...
      - uses: actions/download-artifact@v4
        with:
          name: standalone-windows-amd64
          path: dist
      - name: Verify packaged HTTP and stdio against one SQLite file
        shell: pwsh
        run: |
          $env:RCP_SMOKE_BINARY = (Resolve-Path 'dist/release-control-windows-amd64.exe').Path
          go test -count=1 -run '^TestStandaloneSmoke$' -v ./cmd/server

  docker-sqlite:
    name: Docker SQLite startup and persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -t rcp-standalone-smoke .
      - run: bash scripts/standalone-docker-smoke.sh rcp-standalone-smoke

  release:
    name: Publish standalone release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, windows, docker-sqlite]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: standalone-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          merge-multiple: true
          path: dist
      - name: Publish six binaries with SHA-256 checksums
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="standalone-${GITHUB_SHA:0:12}"
          binaries=(release-control-*)
          [[ "${#binaries[@]}" == 6 ]]
          sha256sum "${binaries[@]}" > SHA256SUMS
          if gh release view "$tag" >/dev/null 2>&1; then
            [[ "$(gh release view "$tag" --json targetCommitish --jq '.targetCommitish')" == "$GITHUB_SHA" ]]
            [[ "$(gh release view "$tag" --json assets --jq '.assets | length')" == 7 ]]
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "Standalone ${GITHUB_SHA:0:12}" \
            --notes 'SQLite standalone builds for Windows, macOS, and Linux. Verify the download against SHA256SUMS.' \
            --latest=false "${binaries[@]}" SHA256SUMS
