name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: releasecontrol
          POSTGRES_PASSWORD: releasecontrol
          POSTGRES_DB: releasecontrol
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U releasecontrol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://releasecontrol:releasecontrol@localhost:5432/releasecontrol?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: make check
