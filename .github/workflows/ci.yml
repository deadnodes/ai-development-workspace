name: Check
on:
  push:
    branches: [main, 'codex/**', 'hotfix/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
jobs:
  check:
    # This shared upstream has its own GitHub-hosted CI, independent of installs.
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: releasecontrol
          POSTGRES_PASSWORD: releasecontrol
          POSTGRES_DB: releasecontrol_tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U releasecontrol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Keep race-instrumented packages from competing for the hosted VM.
      GOFLAGS: -p=1 -timeout=75m
      TEST_DATABASE_URL: postgres://releasecontrol:releasecontrol@localhost:5432/releasecontrol_tests?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify retained-history guards in isolation
        run: go test -race ./internal/persistence -run '^(TestPostgresUpdateRetainsLargeOperationHistory|TestPostgresHistoricalUpdatePreservesRecordsAndTransactions)$' -count=1 -v
      - run: make check

  native-docker:
    name: Native Linux worker and publisher acceptance
    # Own upstream only: never execute fork/PR/bot source with Docker access.
    if: github.repository == 'deadnodes/ai-development-workspace' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.event.sender.type != 'Bot' && !endsWith(github.actor, '[bot]') && github.actor != 'renovate'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: releasecontrol
          POSTGRES_PASSWORD: releasecontrol
          POSTGRES_DB: releasecontrol_native_tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U releasecontrol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOFLAGS: -p=1
      RCP_TEST_DOCKER: '1'
      RCP_TEST_DOCKER_CONTEXT: default
      RCP_TEST_DOCKER_PLATFORM: linux/amd64
      RCP_TEST_DOCKER_DIAGNOSTICS: '1'
      TEST_DATABASE_URL: postgres://releasecontrol:releasecontrol@localhost:5432/releasecontrol_native_tests?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Require native Linux AMD64 and cache immutable fixture images
        # No QEMU, registry login, installations, cluster or deployment access.
        run: |
          test "$(uname -s)/$(uname -m)" = Linux/x86_64
          # Read only: unsupported rootless profiles must still fail closed.
          for setting in /proc/sys/user/max_user_namespaces /proc/sys/kernel/unprivileged_userns_clone /proc/sys/kernel/apparmor_restrict_unprivileged_userns /proc/sys/kernel/apparmor_restrict_unprivileged_unconfined
          do
            if test -r "$setting"; then
              printf '%s=' "$setting"
              cat "$setting"
            fi
          done
          test "$(docker --context default context inspect default --format '{{.Endpoints.docker.Host}}')" = unix:///var/run/docker.sock
          case "$(docker --context default info --format '{{.OSType}}/{{.Architecture}}')" in
            linux/amd64|linux/x86_64) ;;
            *) exit 1 ;;
          esac
          for image in \
            golang@sha256:b305420a68d0f229d91eb3b3ed9e519fcf2cf5461da4bef997bf927e8c0bfd2b \
            moby/buildkit@sha256:78b3b861a6c4d6f2235d1e0ca61d183ff371aa5bd4398051b24815a235b4cf45 \
            registry@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e
          do
            docker --context default pull --platform linux/amd64 "$image"
            test "$(docker --context default image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          done
      - name: Allow only the RootlessKit executable to create user namespaces
        run: bash .github/scripts/rcp-rootlesskit-apparmor.sh setup
      - name: Empty same-profile BuildKit startup and bounded diagnostics
        run: go test ./internal/workerrunner -run '^TestRealBuildKitStartupDiagnostics$' -count=1 -v -timeout=2m
      - name: Real native clean builds with bounded state diagnostics
        run: go test ./internal/workerrunner -run '^TestRealWorkerTwoCleanBuilds$' -count=1 -v -timeout=20m
      - name: Real native worker boundaries, recovery and source provenance
        run: go test ./internal/workerrunner -run '^(TestRealWorkerFailureCancellationExpiryKillAndRestart|TestRealCreateStartSupervisionWindows|TestRealLocalCleanupRecovery|TestRealCleanupContinuesWhenPresenceExceedsJournalBound|TestSourceFetchRealGitRunOneOCI)$' -count=1 -v -timeout=20m
      - name: Real native composition, candidate and selective GitOps fixture chains
        run: go test ./internal/workerrunner -run '^(TestRealComposedGitSourceWorkerPublication|TestRealMainCandidateHistoricalGitProdProfile|TestRealDevGitOpsBatchNativePipeline)$' -count=1 -v -timeout=20m
      - name: Real native API, checks, publisher and registry fixture chains
        run: go test ./internal/transport -run '^(TestRealNativeAPIWorkerPublisherDistributionPR|TestRealNativeChecksWorkerPublisherPR|TestRegistryObservationDistributionProtectedAPI)$' -count=1 -v -timeout=15m
      - name: Remove the temporary RootlessKit AppArmor profile
        if: always()
        run: bash .github/scripts/rcp-rootlesskit-apparmor.sh cleanup

  image:
    name: Publish container
    needs: [check, native-docker]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    # Publishing an upstream image does not deploy any installation.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record published digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Published $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Write immutable build evidence
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          with open('image.json', 'w') as f:
              json.dump({'repository': os.environ['GITHUB_REPOSITORY'],
                         'source_sha': os.environ['GITHUB_SHA'],
                         'run_id': os.environ['GITHUB_RUN_ID'],
                         'image_repository': os.environ['IMAGE_REPOSITORY'].lower(),
                         'digest': os.environ['IMAGE_DIGEST']}, f)
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: rcp-image-evidence
          path: image.json
          if-no-files-found: error
