name: Check
on:
  push:
    branches: [main, 'codex/**', 'hotfix/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
jobs:
  check:
    # This shared upstream has its own GitHub-hosted CI, independent of installs.
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: releasecontrol
          POSTGRES_PASSWORD: releasecontrol
          POSTGRES_DB: releasecontrol_tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U releasecontrol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOFLAGS: -timeout=40m
      TEST_DATABASE_URL: postgres://releasecontrol:releasecontrol@localhost:5432/releasecontrol_tests?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: make check

  image:
    name: Publish container
    needs: check
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    # Publishing an upstream image does not deploy any installation.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record published digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Published $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Write immutable build evidence
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          with open('image.json', 'w') as f:
              json.dump({'repository': os.environ['GITHUB_REPOSITORY'],
                         'source_sha': os.environ['GITHUB_SHA'],
                         'run_id': os.environ['GITHUB_RUN_ID'],
                         'image_repository': os.environ['IMAGE_REPOSITORY'].lower(),
                         'digest': os.environ['IMAGE_DIGEST']}, f)
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: rcp-image-evidence
          path: image.json
          if-no-files-found: error
