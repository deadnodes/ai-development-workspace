services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: releasecontrol
      POSTGRES_PASSWORD: releasecontrol
      POSTGRES_DB: releasecontrol
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - releasecontrol-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U releasecontrol"]
      interval: 2s
      timeout: 3s
      retries: 20
  app:
    profiles: [app]
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://releasecontrol:releasecontrol@db:5432/releasecontrol?sslmode=disable
      LISTEN_ADDR: :8080
      RCP_SECRET_DIR: /run/secrets
      RCP_OBSERVERS_FILE: ${RCP_OBSERVERS_FILE:-}
    volumes:
      - ${RCP_SECRET_DIR_HOST:-./.secrets}:/run/secrets:ro
    ports:
      - "127.0.0.1:8090:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
volumes:
  releasecontrol-data:
