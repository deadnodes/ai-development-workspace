# Optional read-only source context. Use together with compose.yaml.
services:
  app:
    environment:
      RCP_WORKSPACE_ROOT: /workspace
    volumes:
      - type: bind
        source: ${RCP_WORKSPACE_HOST:?Set RCP_WORKSPACE_HOST to an absolute checkout/workspace path}
        target: /workspace
        read_only: true
        bind:
          create_host_path: false
