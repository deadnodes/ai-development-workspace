apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-control
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: release-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: release-control
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: release-control
          # Override in the product overlay with your published image digest.
          image: release-control:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ':8080'
            - name: RCP_SECRET_DIR
              value: /run/secrets
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: release-control-config
                  key: DATABASE_URL
            - name: RC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: release-control-config
                  key: RC_TOKEN
            - name: ALLOWED_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: release-control-config
                  key: ALLOWED_HOSTS
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: github-app
              mountPath: /run/secrets
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: github-app
          secret:
            secretName: release-control-github-app
            optional: true
            defaultMode: 0440
